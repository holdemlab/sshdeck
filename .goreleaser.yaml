# Release config, run by .github/workflows/release.yml for every vX.Y.Z tag
# (tags are created automatically after a merge, see autotag.yml).
# Linux builds: static binaries for amd64 and arm64, plus deb/rpm/apk.
# Try it locally without publishing: make snapshot
version: 2

project_name: sshdeck

before:
  hooks:
    - go mod tidy

builds:
  - id: sshdeck
    main: ./cmd/sshdeck
    binary: sshdeck
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.uk.md
      - CHANGELOG.md
      - examples/sessions.yaml

nfpms:
  - id: packages
    package_name: sshdeck
    homepage: https://github.com/holdemlab/sshdeck
    maintainer: holdemlab <https://github.com/holdemlab>
    description: Terminal SSH session manager with tabs, jump hosts, tunnels and a session tree.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: examples/sessions.yaml
        dst: /usr/share/doc/sshdeck/examples/sessions.yaml
      - src: LICENSE
        dst: /usr/share/doc/sshdeck/LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: holdemlab
    name: sshdeck
  draft: false
  prerelease: auto
