name: Bug report
description: Something does not work as described in the docs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **remove passwords, private keys, internal host names and IPs** from anything you paste.
        Security problems go to [a private report](https://github.com/holdemlab/sshdeck/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead. Quote the exact message shown in the tab or the status bar.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a session with jump: …
        2. Press enter
        3. …
  - type: input
    id: version
    attributes:
      label: sshdeck version
      description: First two lines of `sshdeck --version` (also shown at the right end of the tab bar)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and terminal
      placeholder: e.g. Ubuntu 24.04, kitty 0.39, inside tmux 3.5
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config (sanitized)
      description: The parts of sessions.yaml / config.yaml that matter.
      render: yaml
